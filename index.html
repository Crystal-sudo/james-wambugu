    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --bg: #070b14;
            --bg-secondary: #0b1220;
            --card: rgba(17, 27, 45, 0.72);
            --card-hover: rgba(21, 34, 56, 0.9);

            --text: #f5f7fb;
            --muted: #9ca9bc;

            --mint: #55f2c2;
            --blue: #5aa9ff;
            --purple: #a78bfa;

            --border: rgba(255,255,255,0.09);

            --shadow:
                0 25px 70px rgba(0,0,0,0.35);

            --radius: 22px;
        }

        body {
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(85,242,194,0.07), transparent 30%),
                radial-gradient(circle at 90% 20%, rgba(90,169,255,0.08), transparent 30%),
                var(--bg);

            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
        }

        section {
            padding: 100px 7%;
            position: relative;
        }

        .container {
            max-width: 1250px;
            margin: auto;
        }

        /* =========================================================
           BACKGROUND EFFECTS
        ========================================================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);

            background-size: 50px 50px;

            pointer-events: none;
            z-index: -2;
        }

        .glow {
            position: fixed;
            width: 350px;
            height: 350px;

            border-radius: 50%;
            filter: blur(100px);

            opacity: 0.12;
            pointer-events: none;
            z-index: -1;
        }

        .glow-one {
            background: var(--mint);
            top: 10%;
            left: -150px;
        }

        .glow-two {
            background: var(--blue);
            bottom: 5%;
            right: -150px;
        }

        /* =========================================================
           NAVIGATION
        ========================================================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            padding: 18px 7%;

            z-index: 1000;

            background: rgba(7,11,20,0.78);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        nav {
            max-width: 1250px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--mint);
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;

            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--mint);
        }

        /* =========================================================
           HERO
        ========================================================= */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding-top: 140px;
        }

        .hero-grid {
            max-width: 1250px;
            margin: auto;

            width: 100%;

            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 70px;

            align-items: center;
        }

        .terminal {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            font-family: "JetBrains Mono", monospace;

            font-size: 0.8rem;

            color: var(--mint);

            background: rgba(85,242,194,0.06);

            border: 1px solid rgba(85,242,194,0.15);

            padding: 9px 14px;

            border-radius: 999px;

            margin-bottom: 25px;
        }

        .terminal-dot {
            width: 8px;
            height: 8px;

            background: var(--mint);
            border-radius: 50%;

            box-shadow: 0 0 15px var(--mint);
        }

        .hero h1 {
            font-size: clamp(3rem, 7vw, 6rem);

            line-height: 0.98;

            letter-spacing: -4px;

            margin-bottom: 25px;
        }

        .hero h1 span {
            background:
                linear-gradient(
                    100deg,
                    var(--mint),
                    var(--blue),
                    var(--purple)
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: clamp(1.1rem, 2vw, 1.4rem);

            color: var(--muted);

            max-width: 650px;

            margin-bottom: 35px;
        }

        .hero-subtitle strong {
            color: var(--text);
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 14px 20px;

            border-radius: 12px;

            font-weight: 700;

            border: 1px solid var(--border);

            transition: 0.3s;
        }

        .btn-primary {
            background: var(--mint);
            color: #06100d;

            border-color: var(--mint);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(85,242,194,0.18);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.03);
            color: var(--text);
        }

        .btn-secondary:hover {
            border-color: var(--mint);
            color: var(--mint);
            transform: translateY(-3px);
        }

        /* =========================================================
           HERO ORBIT
        ========================================================= */

        .visual {
            min-height: 450px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .orbit {
            width: 360px;
            height: 360px;

            border-radius: 50%;

            border: 1px solid rgba(85,242,194,0.18);

            position: relative;

            animation: spin 18s linear infinite;
        }

        .orbit::before,
        .orbit::after {
            content: "";

            position: absolute;

            inset: 35px;

            border-radius: 50%;

            border: 1px solid rgba(90,169,255,0.16);
        }

        .orbit::after {
            inset: 75px;

            border-color: rgba(167,139,250,0.16);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .core {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 145px;
            height: 145px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            background:
                radial-gradient(circle at 35% 30%,
                rgba(85,242,194,0.25),
                rgba(8,14,25,0.95));

            border: 1px solid rgba(85,242,194,0.25);

            box-shadow:
                0 0 70px rgba(85,242,194,0.12),
                inset 0 0 40px rgba(85,242,194,0.05);

            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            50% {
                box-shadow:
                    0 0 100px rgba(85,242,194,0.18),
                    inset 0 0 50px rgba(85,242,194,0.08);
            }
        }

        .core-text {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.85rem;
            color: var(--mint);
        }

        .orbit-node {
            position: absolute;

            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: rgba(13,21,36,0.92);

            border: 1px solid var(--border);

            box-shadow: var(--shadow);

            animation: counterSpin 18s linear infinite;
        }

        @keyframes counterSpin {
            to {
                transform: rotate(-360deg);
            }
        }

        .node-1 {
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--mint);
        }

        .node-2 {
            right: -20px;
            top: 50%;
            color: var(--blue);
        }

        .node-3 {
            bottom: -20px;
            left: 50%;
            color: var(--purple);
        }

        .node-4 {
            left: -20px;
            top: 50%;
            color: #fff;
        }

        /* =========================================================
           SECTION TITLES
        ========================================================= */

        .section-heading {
            margin-bottom: 55px;
        }

        .eyebrow {
            color: var(--mint);

            font-family: "JetBrains Mono", monospace;

            font-size: 0.78rem;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        .section-heading h2 {
            font-size: clamp(2rem, 5vw, 3.4rem);

            letter-spacing: -2px;

            margin-bottom: 12px;
        }

        .section-heading p {
            color: var(--muted);
            max-width: 700px;
        }

        /* =========================================================
           ABOUT
        ========================================================= */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 30px;
        }

        .glass-card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            padding: 35px;

            backdrop-filter: blur(20px);

            box-shadow: var(--shadow);

            transition: 0.3s;
        }

        .glass-card:hover {
            background: var(--card-hover);
            transform: translateY(-5px);
        }

        .glass-card h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .glass-card p {
            color: var(--muted);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;

            margin-top: 25px;
        }

        .stat {
            padding: 20px;

            border-radius: 15px;

            background: rgba(255,255,255,0.03);

            border: 1px solid var(--border);
        }

        .stat strong {
            display: block;

            font-size: 1.7rem;

            color: var(--mint);
        }

        .stat span {
            color: var(--muted);
            font-size: 0.8rem;
        }

        /* =========================================================
           SKILLS
        ========================================================= */

        .skills-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;
        }

        .skill-card {
            padding: 30px;

            border-radius: var(--radius);

            background: var(--card);

            border: 1px solid var(--border);

            transition: 0.3s;
        }

        .skill-card:hover {
            transform: translateY(-6px);
            border-color: rgba(85,242,194,0.25);
        }

        .skill-icon {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: rgba(85,242,194,0.08);

            color: var(--mint);

            font-size: 1.3rem;

            margin-bottom: 20px;
        }

        .skill-card h3 {
            margin-bottom: 15px;
        }

        .skill-list {
            list-style: none;
            color: var(--muted);
        }

        .skill-list li {
            padding: 6px 0;
        }

        .skill-list li::before {
            content: "▹";
            color: var(--mint);
            margin-right: 8px;
        }

        /* =========================================================
           PROJECTS
        ========================================================= */

        .projects-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 28px;
        }

        .project-card {
            overflow: hidden;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-7px);

            border-color:
                rgba(85,242,194,0.25);
        }

        .video-container {
            width: 100%;

            background: #02040a;

            aspect-ratio: 16 / 9;
        }

        .video-container video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        .project-content {
            padding: 28px;
        }

        .project-content h3 {
            font-size: 1.35rem;
            margin-bottom: 10px;
        }

        .project-content p {
            color: var(--muted);
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin-top: 18px;
        }

        .tag {
            padding: 6px 10px;

            border-radius: 999px;

            font-size: 0.72rem;

            background: rgba(85,242,194,0.07);

            border: 1px solid rgba(85,242,194,0.12);

            color: var(--mint);
        }

        /* =========================================================
           EXPERIENCE
        ========================================================= */

        .timeline {
            position: relative;

            max-width: 950px;

            margin: auto;
        }

        .timeline::before {
            content: "";

            position: absolute;

            left: 10px;
            top: 0;
            bottom: 0;

            width: 1px;

            background:
                linear-gradient(
                    var(--mint),
                    rgba(85,242,194,0)
                );
        }

        .timeline-item {
            position: relative;

            padding-left: 50px;

            margin-bottom: 45px;
        }

        .timeline-dot {
            position: absolute;

            left: 3px;
            top: 7px;

            width: 15px;
            height: 15px;

            border-radius: 50%;

            background: var(--mint);

            box-shadow:
                0 0 20px rgba(85,242,194,0.4);
        }

        .timeline-date {
            font-family: "JetBrains Mono", monospace;

            color: var(--mint);

            font-size: 0.8rem;

            margin-bottom: 8px;
        }

        .timeline-item h3 {
            font-size: 1.25rem;
        }

        .company {
            color: var(--blue);

            font-weight: 600;

            margin-bottom: 8px;
        }

        .location {
            color: var(--muted);

            font-size: 0.85rem;

            margin-bottom: 10px;
        }

        .timeline-item p {
            color: var(--muted);
        }

        /* =========================================================
           EDUCATION
        ========================================================= */

        .education-grid {
            display: grid;

            grid-template-columns:
                repeat(2,1fr);

            gap: 25px;
        }

        .education-card {
            padding: 30px;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: var(--radius);
        }

        .education-card i {
            color: var(--mint);

            font-size: 1.5rem;

            margin-bottom: 18px;
        }

        .education-card h3 {
            margin-bottom: 8px;
        }

        .education-card p {
            color: var(--muted);
        }

        /* =========================================================
           CONTACT
        ========================================================= */

        .contact-box {
            max-width: 950px;

            margin: auto;

            padding: 55px;

            text-align: center;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(85,242,194,0.08),
                    transparent 50%
                ),
                var(--card);

            border: 1px solid var(--border);

            border-radius: 30px;

            box-shadow: var(--shadow);
        }

        .contact-box h2 {
            font-size: clamp(2rem,5vw,3.5rem);

            letter-spacing: -2px;

            margin-bottom: 15px;
        }

        .contact-box > p {
            color: var(--muted);

            max-width: 60
